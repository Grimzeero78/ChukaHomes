<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChukaHomes — Student Housing & Hostel Finder, Chuka</title>
<meta name="description" content="Find bedsitters, hostels and houses near Chuka University. Verified landlords, honest prices, no door-to-door.">
<meta name="theme-color" content="#0E5A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href='data:application/manifest+json,{"name":"ChukaHomes","short_name":"ChukaHomes","start_url":".","display":"standalone","background_color":"%23F6F3EA","theme_color":"%230E5A33"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#F6F3EA; --card:#FFFFFF; --ink:#17251D; --ink2:#5D685E; --ink3:#8B9188;
  --line:#E4DFD0; --line2:#D3CDBB;
  --green:#0E5A33; --green2:#1B7A47; --green-soft:#E5EFE2; --green-ink:#0A3D24;
  --orange:#E0620F; --orange-d:#C25208; --orange-soft:#FBEADB;
  --amber:#9A5B0B; --amber-soft:#FBF0D8;
  --red:#B3372B; --red-soft:#F8E6E2;
  --blue:#4E86AE;
  --r:16px; --sh:0 1px 2px rgba(23,37,29,.06),0 6px 18px -8px rgba(23,37,29,.14);
  --disp:"Bricolage Grotesque",Georgia,serif; --ui:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
img{display:block;max-width:100%}
button{font-family:var(--ui);border:0;background:none;color:inherit;cursor:pointer;font-size:14px}
input,select,textarea{font-family:var(--ui);font-size:16px;color:var(--ink)}
a{color:inherit;text-decoration:none}
svg{display:block}
.wrap{max-width:640px;margin:0 auto;min-height:100dvh}
main#view{max-width:640px;margin:0 auto;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
body.sub main#view{padding-bottom:0}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:-.01em}
::selection{background:var(--green);color:#fff}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--green);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash.off{opacity:0;visibility:hidden}
.s-in{text-align:center;color:#F6F3EA}
.s-in .mark{width:64px;height:64px;margin:0 auto 14px;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) backwards}
.s-word{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.02em;animation:up .55s .12s backwards}
.s-sub{font-size:11px;letter-spacing:.22em;margin-top:6px;color:#BCD8C4;animation:up .55s .22s backwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}}

/* ---------- generic ---------- */
.icbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;position:relative;flex:none}
.icbtn:hover{background:rgba(14,90,51,.08)}
.icbtn svg{width:21px;height:21px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn-p{background:var(--orange);color:#fff}
.btn-p:hover{background:var(--orange-d)}
.btn-g{background:var(--green);color:#fff}
.btn-o{border:1.5px solid var(--line2);background:var(--card)}
.btn-wa{background:#1FA855;color:#fff}
.btn-danger{background:var(--red-soft);color:var(--red)}
.grow{flex:1}
.sq{width:48px;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:1.5px solid var(--line2);border-radius:999px;font-weight:600;font-size:13.5px;background:var(--card);white-space:nowrap;transition:all .12s}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip svg{width:15px;height:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.seclabel{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.seclabel a{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--green);font-weight:700}
.muted{color:var(--ink2)}.tiny{font-size:12.5px}
.hr{height:1px;background:var(--line);border:0;margin:14px 0}
.vbadge{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-weight:700;font-size:12.5px}
.vbadge svg{width:15px;height:15px}
.uvbadge{display:inline-flex;align-items:center;gap:4px;color:var(--amber);font-weight:700;font-size:12.5px}
.uvbadge svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill-g{background:var(--green-soft);color:var(--green-ink)}
.pill-o{background:var(--orange-soft);color:var(--orange-d)}
.pill-a{background:var(--amber-soft);color:var(--amber)}
.pill-r{background:var(--red-soft);color:var(--red)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;font-family:var(--disp);flex:none}

/* ---------- tabbar ---------- */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,640px);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
body.sub #tabbar{display:none}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--ink3);font-size:10.5px;font-weight:700;position:relative}
.tbtn svg{width:22px;height:22px}
.tbtn.on{color:var(--green)}
.tbtn.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--green)}
.nbadge{position:absolute;top:5px;right:calc(50% - 20px);background:var(--orange);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* ---------- toasts / sheets ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
body.sub #toasts{bottom:calc(20px + env(safe-area-inset-bottom))}
.toast{background:var(--green-ink);color:#fff;padding:13px 16px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);animation:up .3s}
.toast svg{width:17px;height:17px;flex:none;color:#9BD4AE}
.toast.warn{background:#5C3A10}
.ovl{position:fixed;inset:0;background:rgba(13,26,19,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s}
.ovl.show{opacity:1}
.sheet{background:var(--bg);width:min(100%,640px);max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.ovl.show .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 14px}

/* ---------- skeleton ---------- */
.skel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;margin-bottom:10px}
.skel .b{background:#EAE5D6;border-radius:8px;animation:shim 1.1s infinite}
@keyframes shim{50%{opacity:.45}}

/* ---------- home ---------- */
.hhero{background:var(--green);color:#F2F6EE;padding:18px 18px 20px;border-radius:0 0 24px 24px}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:42px;height:42px}
.brand b{font-family:var(--disp);font-weight:800;font-size:22px;display:block;line-height:1;letter-spacing:-.02em}
.brand small{font-size:9.5px;letter-spacing:.2em;color:#9CC3A8;font-weight:700}
.hhero .icbtn{color:#DCEADF}
.hhero .icbtn:hover{background:rgba(255,255,255,.12)}
.htag{font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.25;margin:16px 0 14px;color:#fff}
.hsearch{width:100%;display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink3);border-radius:14px;padding:15px 15px;font-size:14.5px;font-weight:600;text-align:left;box-shadow:var(--sh)}
.hsearch svg{width:19px;height:19px;color:var(--green)}
.trustrow{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#C4DCC9;margin-top:13px;font-weight:600}
.trustrow svg{width:16px;height:16px;flex:none;color:#8FD1A4}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:16px 18px 4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.fcard{flex:none;width:225px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.fcard .ph{position:relative;height:120px}
.fcard img{width:100%;height:100%;object-fit:cover}
.fcard .in{padding:10px 12px 12px}
.ribbon{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:7px}
.list{padding:0 18px}
.lcard{display:grid;grid-template-columns:98px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px;transition:box-shadow .15s;cursor:pointer}
.lcard:hover{box-shadow:var(--sh)}
.lph{position:relative;width:98px;height:98px;border-radius:12px;overflow:hidden;background:#E8E3D4}
.lph img{width:100%;height:100%;object-fit:cover}
.takentag{position:absolute;inset:0;background:rgba(23,37,29,.55);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.12em}
.lprice{font-family:var(--disp);font-weight:800;font-size:18px;color:var(--green)}
.lprice span{font-size:12px;color:var(--ink3);font-weight:600}
.lcard h3{font-size:14.5px;font-weight:700;margin:2px 0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.lmeta{font-size:12.5px;color:var(--ink2)}
.lam{display:flex;gap:9px;align-items:center;margin:7px 0 5px;color:var(--ink2)}
.lam svg{width:15px;height:15px;color:var(--green2)}
.lam .walk{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:12px;font-weight:700;color:var(--ink);background:var(--green-soft);padding:3px 8px;border-radius:999px}
.lam .walk svg{width:13px;height:13px;color:var(--green)}
.lfoot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink3)}
.areapills{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;scrollbar-width:none}
.areapills::-webkit-scrollbar{display:none}
.apill{flex:none;display:flex;flex-direction:column;padding:10px 14px;border:1.5px solid var(--line2);border-radius:14px;background:var(--card);min-width:104px;text-align:left}
.apill b{font-family:var(--disp);font-size:14px}
.apill span{font-size:11px;color:var(--ink3);font-weight:600}
.hfoot{padding:20px 18px 26px;text-align:center;color:var(--ink3);font-size:12px}
.hfoot b{color:var(--ink2)}

/* ---------- headers on sub screens ---------- */
.shead{position:sticky;top:0;z-index:30;background:rgba(246,243,234,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.shead h2{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .icbtn:hover{background:var(--green-soft)}

/* ---------- search ---------- */
.sbar{display:flex;gap:8px;padding:12px 18px;position:sticky;top:0;background:rgba(246,243,234,.95);backdrop-filter:blur(8px);z-index:25;border-bottom:1px solid var(--line)}
.sbar .inp{flex:1;display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line2);border-radius:14px;padding:0 12px}
.sbar input{border:0;outline:0;background:none;flex:1;height:46px}
.sbar svg{width:18px;height:18px;color:var(--ink3)}
.fbtn{position:relative;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);display:grid;place-items:center}
.fbtn svg{width:20px;height:20px}
.fbtn .cnt{position:absolute;top:-6px;right:-6px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.sortrow{display:flex;gap:8px;padding:12px 18px 4px;overflow-x:auto;scrollbar-width:none}
.sortrow::-webkit-scrollbar{display:none}
.srchd{padding:10px 18px 0;font-size:12.5px;color:var(--ink3);font-weight:600}
.empty{padding:44px 30px;text-align:center}
.empty .eic{width:62px;height:62px;border-radius:20px;background:var(--green-soft);display:grid;place-items:center;margin:0 auto 14px}
.empty .eic svg{width:28px;height:28px;color:var(--green)}
.empty h3{font-size:18px;margin-bottom:6px}
.empty p{color:var(--ink2);font-size:13.5px;margin-bottom:16px}

/* ---------- map ---------- */
.mapcard{margin:14px 14px 0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#EFEAD9;position:relative}
#mapSvg{width:100%;height:auto;display:block;touch-action:none;cursor:grab}
#mapSvg:active{cursor:grabbing}
.maphud{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.maphud button{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.95);border:1px solid var(--line2);display:grid;place-items:center;box-shadow:var(--sh)}
.maphud svg{width:18px;height:18px}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 20px 4px;font-size:12px;color:var(--ink2);font-weight:600}
.maplegend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.pin{cursor:pointer}
.pini{transform-box:fill-box;transform-origin:50% 100%;animation:pindrop .45s cubic-bezier(.2,.8,.3,1.25) backwards;transition:transform .15s}
@keyframes pindrop{from{opacity:0;transform:translateY(-16px) scale(.5)}}
.pin.sel .pini{transform:scale(1.18) translateY(-3px)}
.pinb{stroke:#fff;stroke-width:2}
.pin.av .pinb{fill:var(--green)}
.pin.uv .pinb{fill:#fff;stroke:var(--green)}
.pin.tk .pinb{fill:#A79F8B}
.pin text{font-family:var(--ui);font-weight:800;font-size:10.5px}
.pin.av text,.pin.tk text{fill:#fff}
.pin.uv text{fill:var(--green)}
.bsring{fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:3 4}
.ring{fill:none;stroke:var(--green);stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:5 7}
.ringlab{font-family:var(--ui);font-weight:800;font-size:8.5px;letter-spacing:.14em;fill:#4E7B5C}
.mlab{font-family:var(--ui);font-weight:800;font-size:9.5px;letter-spacing:.16em;fill:#7C7660}
.mlab2{font-family:var(--ui);font-weight:700;font-size:7.5px;letter-spacing:.1em;fill:#97917C}
.campuslab{font-family:var(--disp);font-weight:800;font-size:11px;letter-spacing:.12em;fill:#5E8A6C}
#mPrev{position:fixed;left:50%;transform:translateX(-50%) translateY(110%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(94vw,600px);background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:0 18px 44px -12px rgba(23,37,29,.35);z-index:45;transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:12px;display:flex;gap:12px}
#mPrev.show{transform:translateX(-50%) translateY(0)}
#mPrev img{width:86px;height:86px;border-radius:14px;object-fit:cover}

/* ---------- listing detail ---------- */
.gal{position:relative;background:#DDD8C8}
.galrow{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.galrow::-webkit-scrollbar{display:none}
.galrow>div{flex:none;width:100%;scroll-snap-align:start;position:relative}
.galrow img{width:100%;height:300px;object-fit:cover}
.wm::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='170'%20height='130'%3E%3Ctext%20x='12'%20y='96'%20font-family='Arial,sans-serif'%20font-size='14'%20font-weight='700'%20fill='rgba(255,255,255,0.32)'%20transform='rotate(-18%2085%2065)'%3ECHUKAHOMES%3C/text%3E%3C/svg%3E");background-size:170px 130px}
.gal .fl{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5}
.gal .fl .icbtn{background:rgba(255,255,255,.94);box-shadow:var(--sh)}
.gal .cnt{position:absolute;bottom:12px;right:14px;background:rgba(13,26,19,.6);color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;z-index:5}
.gdots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:5}
.gdots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:all .2s}
.gdots i.on{width:18px;background:#fff}
.dbody{padding:16px 18px 8px}
.dprice{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dprice b{font-family:var(--disp);font-weight:800;font-size:30px;color:var(--green);letter-spacing:-.02em}
.dprice span{color:var(--ink3);font-weight:600}
.dbody h2{font-size:21px;margin:6px 0 4px;line-height:1.2}
.ban{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;margin:14px 0;line-height:1.4}
.ban svg{width:18px;height:18px;flex:none;margin-top:1px}
.ban-a{background:var(--amber-soft);color:var(--amber)}
.ban-g{background:var(--green-soft);color:var(--green-ink)}
.ban-r{background:var(--red-soft);color:var(--red)}
.lcard2{display:flex;gap:12px;align-items:center;padding:13px 14px;margin:14px 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.fact svg{width:16px;height:16px;color:var(--green);margin-bottom:5px}
.fact b{display:block;font-family:var(--disp);font-size:15px}
.fact span{font-size:11.5px;color:var(--ink3);font-weight:600}
.urow{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.urow:last-child{border:0}
.urow svg{width:19px;height:19px;color:var(--green);flex:none;margin-top:2px}
.urow b{font-size:13.5px}
.urow span{display:block;font-size:13px;color:var(--ink2)}
.ok svg{color:var(--green2)}.no svg{color:#B9B29E}
.rulechips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.abar{position:sticky;bottom:0;background:rgba(246,243,234,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;z-index:30}

/* ---------- chats ---------- */
.conv{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.conv:hover{background:rgba(14,90,51,.04)}
.conv .mid{flex:1;min-width:0}
.conv .top{display:flex;justify-content:space-between;gap:8px}
.conv .top b{font-size:14.5px}
.conv .top span{font-size:11.5px;color:var(--ink3)}
.conv .prev{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv .lthumb{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.unread{background:var(--orange);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.msgs{padding:16px 16px 8px;overflow-y:auto;flex:1}

let F=emptyF(),FT=null,MAPSEL=null,MAPAVAIL=false;
function emptyF(){return {q:'',types:[],areas:[],min:'',max:'',maxWalk:'',gender:[],furn:[],amen:{},hideTaken:true,sort:'new'};}
function match(l,f){
  if(f.hideTaken&&l.status==='taken')return false;
  if(f.q){const q=f.q.toLowerCase();if(!(l.title+' '+l.area+' '+l.landmark+' '+l.type).toLowerCase().includes(q))return false;}
  if(f.types.length&&!f.types.includes(l.type))return false;
  if(f.areas.length&&!f.areas.includes(l.area))return false;
  if(f.min&&l.rent<+f.min)return false;
  if(f.max&&l.rent>+f.max)return false;
  if(f.maxWalk&&l.walkGate>+f.maxWalk)return false;
  if(f.gender.length&&!f.gender.includes(l.gender))return false;
  if(f.furn.length&&!f.furn.includes(l.furnishing))return false;
  const a=f.amen||{};
  if(a.wifi&&!hasWifi(l))return false; if(a.water&&!hasWater(l))return false; if(a.elec&&!hasElec(l))return false;
  if(a.ensuite&&!ensuite(l))return false; if(a.kitchen&&!ownKit(l))return false; if(a.guard&&!guardOK(l))return false; if(a.backup&&!backupOK(l))return false;
  return true;
}
const applyF=(ls,f)=>ls.filter(l=>match(l,f)).sort((a,b)=>f.sort==='priceAsc'?a.rent-b.rent:f.sort==='priceDesc'?b.rent-a.rent:f.sort==='walk'?a.walkGate-b.walkGate:b.listedAt-a.listedAt);
const activeChips=f=>{const c=[];f.types.forEach(t=>c.push({k:'types',v:t,label:t}));f.areas.forEach(a=>c.push({k:'areas',v:a,label:a}));f.gender.forEach(g=>c.push({k:'gender',v:g,label:g}));f.furn.forEach(x=>c.push({k:'furn',v:x,label:x}));if(f.min||f.max)c.push({k:'price',label:kes(f.min||0)+(f.max?' – '+kes(f.max):'+')});if(f.maxWalk)c.push({k:'maxWalk',label:'≤ '+f.maxWalk+' min to gate'});Object.entries(f.amen||{}).filter(([,v])=>v).forEach(([k])=>c.push({k:'amen:'+k,label:{wifi:'WiFi included',water:'Water included',elec:'Electricity incl.',ensuite:'Ensuite',kitchen:'Own kitchen',guard:'Security guard',backup:'Backup power'}[k]}));if(!f.hideTaken)c.push({k:'hideTaken',label:'Includes taken'});return c;};

/* ---------- replies (simulated landlord) ---------- */
function autoReply(text,l){
  const t=text.toLowerCase();
  if(/avail|vacant|free|still/.test(t))return `Yes, it is still available. You can come view it any day between 9 am and 5 pm.`;
  if(/price|rent|reduce|bargain|nego|lower|less|deposit|pay|mpesa/.test(t))return `Please do not send any money before viewing the unit in person. The deposit is ${l.deposit?kes(l.deposit):'none'} — we sort payment at the office after you have seen the place.`;
  if(/water/.test(t))return l.water==='Rationed'?`Water flows ${l.waterSched.toLowerCase()}, but there is ${l.waterTank==='Yes'?'a storage tank, so you never fully run out':'no tank, so plan with a bucket'}.`:`Water is ${l.water.toLowerCase()} and there is ${l.waterTank==='Yes'?'a storage tank on the compound':'no storage tank'}.`;
  if(/wifi|internet|data/.test(t))return l.wifi==='Included in rent'?`Yes, WiFi is included in the rent (${l.wifiProvider}).`:`WiFi is ${l.wifi.toLowerCase()}${l.wifiCost?` at ${l.wifiCost}`:''}.`;
  if(/view|visit|see|today|tomorrow|pass/.test(t))return `Karibu! Come view between 9 am and 5 pm. Ask for me where you see the ChukaHomes sign.`;
  if(/room|house|bedsit|unit|size|furnish/.test(t))return `It is a ${l.type.toLowerCase()}, ${l.furnishing.toLowerCase()}, on the ${l.floor==='Ground'?'ground':l.floor+' floor'}. ${l.units>1?l.units+' units are vacant.':'One unit is vacant.'}`;
  return ['Noted, comrade. Anything else you would like to know?','You are welcome to pass by and see it yourself first.','Let me confirm and get back to you shortly.'][Math.floor(Math.random()*3)];
}

let MP={s:1,x:0,y:0};
function mapInit(params){
  const svg=$('#mapSvg'),pan=$('#pan');if(!svg)return;
  if(MAPSEL&&params.sel){const l=listing(MAPSEL);if(l){const[x,y]=pj(l.lat,l.lng);MP={s:1.5,x:200-x*1.5,y:270-y*1.5};showPrev(l);}else MAPSEL=null;}
  const apply=()=>pan.setAttribute('transform',`translate(${MP.x},${MP.y}) scale(${MP.s})`);
  apply();
  let drag=null,moved=false;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox:MP.x,oy:MP.y};moved=false;svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)moved=true;MP.x=drag.ox+dx;MP.y=drag.oy+dy;apply();});
  svg.addEventListener('pointerup',()=>{if(!moved){MAPSEL=null;hidePrev();$$('.pin.sel').forEach(p=>p.classList.remove('sel'));}drag=null;});
  svg.addEventListener('pointercancel',()=>drag=null);
}

/* ---------- CHATS ---------- */
function myConvs(){return DB.convs.filter(c=>c.studentId===DB.session||c.landlordId===DB.session).sort((a,b)=>lastMsg(b).ts-lastMsg(a).ts);}
const lastMsg=c=>c.msgs[c.msgs.length-1]||{ts:0,text:''};
function renderChats(){
  const cs=myConvs();
  return `<div>
  <header class="shead" style="border-bottom:0"><h2 style="font-family:var(--disp)">Chats</h2></header>
  ${cs.length?cs.map(c=>{
    const other=user(c.studentId===DB.session?c.landlordId:c.studentId),l=listing(c.listingId),m=lastMsg(c);
    const un=c.msgs.filter(x=>x.from!==DB.session&&!x.read).length;
    return `<div class="conv" onclick="App.openC('${c.id}')">
      <span class="av" style="background:${avCol(other?other.name:'X')}">${other?initials(other.name):'?'}</span>
      <div class="mid">
        <div class="top"><b>${esc(other?other.name:'User')} ${other&&other.verified?'<i data-lucide="badge-check" style="width:14px;height:14px;color:var(--green);display:inline"></i>':''}</b><span>${timeAgo(m.ts)}</span></div>
        <div class="prev">${esc(m.text||'No messages yet')}</div>
      </div>
      <img class="lthumb" src="${l?l.photos[0]:''}" alt="">
      ${un?`<span class="unread">${un}</span>`:''}
    </div>`;}).join('')
  :`<div class="empty" style="padding-top:70px"><div class="eic"><i data-lucide="message-circle"></i></div><h3>No chats yet</h3><p>Open any listing and hit “Chat with landlord”. Ask about water, WiFi and viewing times — that's what they're for.</p></div>`}
  </div>`;
}
function renderThread(p){
  const c=DB.convs.find(x=>x.id===p.id);if(!c)return renderChats();
  c.msgs.forEach(m=>{if(m.from!==DB.session)m.read=true;});save();
  const other=user(c.studentId===DB.session?c.landlordId:c.studentId),l=listing(c.listingId),meU=me();
  let html='',day='';
  [...c.msgs].sort((a,b)=>a.ts-b.ts).forEach(m=>{
    const d=dayLab(m.ts);
    if(d!==day){day=d;html+=`<div class="daysep">${d}</div>`;}
    html+=`<div class="bub ${m.from===DB.session?'me':'them'}">${esc(m.text)}<time>${new Date(m.ts).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'})}</time></div>`;
  });
  return `<div class="threadwrap">
  <header class="shead">
    <button class="icbtn" onclick="App.tab('chats')"><i data-lucide="arrow-left"></i></button>
    <div class="thhead" onclick="App.openL('${l.id}')">
      <img src="${l.photos[0]}" alt="">
      <div style="min-width:0"><b>${esc(other?other.name:'User')}${other&&other.verified?'<i data-lucide="badge-check"></i>':''}${other&&other.role==='student'&&other.verified?' <span class="pill pill-g" style="font-size:10px">Verified Comrade</span>':''}</b><small>${esc(l.title)} · ${kes(l.rent)}/${perShort(l.period)}</small></div>
    </div>
    <button class="icbtn" onclick="App.chatMenu('${c.id}')"><i data-lucide="ellipsis-vertical"></i></button>
  </header>
  <div id="msgs" class="msgs">${html}</div>
  ${c.blocked?`<div style="padding:16px;text-align:center;color:var(--ink2);font-size:13.5px">You blocked this user. <button class="sbtn" style="margin-left:6px" onclick="App.unblockC('${c.id}')">Unblock</button></div>`
  :`<div class="qrow" style="border-top:1px solid var(--line)">${meU&&meU.role==='landlord'?QUICK.map(q=>`<button class="chip" onclick="App.qr('${esc(q).replace(/'/g,'&#39;')}','${c.id}')">${esc(q)}</button>`).join(''):''}</div>
  <form class="cinput" onsubmit="App.send(event,'${c.id}')"><input id="cnl" placeholder="Message…" autocomplete="off"><button class="snd" type="submit"><i data-lucide="send"></i></button></form>`}
  </div>`;
}

    +inp('landmark','Nearest landmark','e.g. Opposite Ndagani Shopping Centre')
    +`<label class="fld"><span>Drop the pin on the map</span>

    +seg('visitors','Visitors allowed?',VISIT)+seg('alcohol','Alcohol allowed?',['Yes','No']);}
  if(WSTEP===7){

  if(WSTEP===8){

   APP CONTROLLER

let DRAFT=null;
const App={
  /* navigation */
  tab(n){if(n!=='chats'&&!DB.session&&n!=='profile'&&n!=='home'&&n!=='map'){/* allow guest browsing */}tab(n);},
  tab2(n){tab(n);},
  go(n){go(n);},
  back(){back();},
  closeM(e){if(!e||e.target.classList.contains('ovl'))closeM();},
  /* home */
  quick(i){const presets=[{}, {types:['Bedsitter']},{types:['Single Room']},{max:4000},{amen:{wifi:true}},{amen:{ensuite:true}},{maxWalk:7}];F=Object.assign(emptyF(),presets[i],{amen:Object.assign({},presets[i].amen||{})});tab('search');},
  areaQ(a){F=emptyF();F.areas=[a];tab('search');},
  /* search */
  qset(v){F.q=v;const el=$('#res');if(el){const res=applyF(visibleListings(),F);el.innerHTML=res.length?res.map(listRow).join(''):`<div class="empty card" style="margin-top:14px"><div class="eic"><i data-lucide="search"></i></div><h3>No listings match</h3><p>Try widening your price range or clearing a filter.</p><button class="btn btn-o" onclick="App.resetF()">Reset filters</button></div>`;icons();}},
  setSort(s){F.sort=s;render();},
  rmChip(k,v){if(k==='types'||k==='areas'||k==='gender'||k==='furn')F[k]=F[k].filter(x=>x!==v);else if(k==='maxWalk')F.maxWalk='';else if(k==='price'){F.min='';F.max='';}else if(k==='hideTaken')F.hideTaken=true;else if(k.startsWith('amen:'))F.amen[k.slice(5)]=false;render();},
  resetF(){F=emptyF();render();},
  openFilters(){openFilters();},
  fmin(v){FT.min=v;fcount();},fmax(v){FT.max=v;fcount();},
  tchip(el,k,v){const a=FT[k];const i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);el.classList.toggle('on');fcount();},
  schip(el,k,v){[...el.parentNode.children].forEach(b=>b.classList.remove('on'));if(String(FT[k])===String(v)){FT[k]='';}else{FT[k]=v;el.classList.add('on');}fcount();},
  achip(el,k){FT.amen[k]=!FT.amen[k];el.classList.toggle('on');fcount();},
  ftaken(v){FT.hideTaken=!v;fcount();},
  resetFT(){FT=emptyF();closeM();openFilters();},
  applyF(){F=JSON.parse(JSON.stringify(FT));closeM();render();},
  saveSearch(){const u=me();if(!u)return App.gate();const w={id:'w'+DB.nextIds.w++,userId:u.id,criteria:JSON.parse(JSON.stringify(FT)),label:summarize(FT),created:Date.now(),newCount:0};DB.watches.push(w);save();closeM();toast('Saved — we\'ll flag new matches in your profile.','bell');},
  saveSearchF(){FT=JSON.parse(JSON.stringify(F));App.saveSearch();},
  /* map */
  tglAvail(){MAPAVAIL=!MAPAVAIL;render();},
  zoom(f){const ns=Math.min(2.6,Math.max(.7,MP.s*f));MP.x=200-(200-MP.x)/MP.s*ns;MP.y=270-(270-MP.y)/MP.s*ns;MP.s=ns;$('#pan').setAttribute('transform',`translate(${MP.x},${MP.y}) scale(${MP.s})`);},
  resetMap(){MP={s:1,x:0,y:0};MAPSEL=null;hidePrev();render();},
  selPin(id){MAPSEL=id;$$('.pin').forEach(p=>p.classList.toggle('sel',p.dataset.id===id));const l=listing(id);l&&showPrev(l);},
  closePrev(){MAPSEL=null;hidePrev();$$('.pin.sel').forEach(p=>p.classList.remove('sel'));},
  viewOnMap(id){MAPSEL=id;tab('map');},
  /* listing */
  openL(id){const l=listing(id);if(!l)return;go('listing',{id});},
  galScroll(el){const i=Math.round(el.scrollLeft/el.clientWidth);const d=$('#gdots');if(d)[...d.children].forEach((x,j)=>x.classList.toggle('on',j===i));$('.gal .cnt').textContent=(i+1)+' / '+el.children.length;},
  fav(id,btn){const u=me();if(!u)return App.gate('Sign in to save listings.');DB.favorites=DB.favorites||[];const i=DB.favorites.findIndex(f=>f.userId===u.id&&f.listingId===id);if(i>-1){DB.favorites.splice(i,1);btn.querySelector('svg')&&btn.querySelector('svg').remove();btn.innerHTML='<i data-lucide="heart"></i>';toast('Removed from saved.','heart');}else{DB.favorites.push({userId:u.id,listingId:id});btn.innerHTML='<i data-lucide="heart"></i>';const s=btn.querySelector('svg');if(s){s.style.fill='var(--red)';s.style.color='var(--red)';}toast('Saved to your list.','heart');}icons();save();},
  lMenu(id){modal(`<h2 style="font-size:18px;margin-bottom:6px">${esc(listing(id).title)}</h2>
    <div class="prow" onclick="App.reportL('${id}')"><i data-lucide="flag"></i><div class="mid"><b>Report listing</b><small>Fake, taken, or wrong info</small></div></div>
    <div class="prow" onclick="App.shareL('${id}')"><i data-lucide="share-2"></i><div class="mid"><b>Share</b><small>Copy link to this listing</small></div></div>
    <div class="prow" onclick="App.fav('${id}',this)"><i data-lucide="heart"></i><div class="mid"><b>Save / unsave</b><small>Add to your list</small></div></div>`);},
  shareL(id){closeM();toast('Link copied — chukahomes.ke/l/'+id+' (demo).','share-2');},
  reportL(id){closeM();modal(`<h2 style="font-size:18px;margin-bottom:4px">Report this listing</h2><p class="tiny muted" style="margin-bottom:14px">Admins review every report. Serial scammers get banned.</p>
    <label class="fld"><span>Reason</span><select id="rreason">${REPORTS.map(r=>`<option>${r}</option>`).join('')}</select></label>
    <label class="fld"><span>Tell us more (optional)</span><textarea id="rnote" placeholder="e.g. The caretaker is asking a different price…"></textarea></label>
    <button class="btn btn-p" style="width:100%" onclick="App.sendReport('${id}')">Send report</button>`);},
  sendReport(id){const u=me();if(!u)return App.gate();DB.reports.push({id:'r'+DB.nextIds.r++,listingId:id,by:u.id,reason:$('#rreason').value,note:$('#rnote').value||'—',ts:Date.now(),status:'open'});save();closeM();back();toast('Report sent to admins. Asante for keeping ChukaHomes honest.','flag');},
  chatL(id){const u=me();if(!u)return App.gate('Sign in to chat with landlords.');const l=listing(id);if(!l)return;if(l.ownerId===u.id){toast('That\'s your own listing.','info');return;}const cid='c_'+id+'_'+u.id;let c=DB.convs.find(x=>x.id===cid);if(!c){c={id:cid,listingId:id,studentId:u.id,landlordId:l.ownerId,blocked:false,autoDone:false,msgs:[]};DB.convs.push(c);save();}go('thread',{id:cid});},
  gate(msg){toast(msg||'Sign in first — it takes 20 seconds.','lock');stack.length=0;stack.push({name:'auth'});render();},
  call(){},wa(){},
  /* chats */
  openC(id){go('thread',{id});},
  chatMenu(cid){const c=DB.convs.find(x=>x.id===cid);modal(`<div class="prow" onclick="App.reportL('${c.listingId}')"><i data-lucide="flag"></i><div class="mid"><b>Report this chat</b><small>Goes to admins with the listing attached</small></div></div>
    <div class="prow" onclick="App.blockC('${cid}')"><i data-lucide="ban"></i><div class="mid"><b>Block user</b><small>No more messages from them</small></div></div>`);},
  blockC(cid){const c=DB.convs.find(x=>x.id===cid);c.blocked=true;save();closeM();render();toast('User blocked.','ban');},
  unblockC(cid){const c=DB.convs.find(x=>x.id===cid);c.blocked=false;save();render();},
  qr(t,cid){const inp=$('#cnl');if(inp){inp.value=t;inp.focus();}},
  send(e,cid){e.preventDefault();const inp=$('#cnl');const t=inp.value.trim();if(!t)return;const c=DB.convs.find(x=>x.id===cid);const u=me();
    c.msgs.push({from:u.id,text:t,ts:Date.now(),read:true});save();
    const msgs=$('#msgs');msgs.insertAdjacentHTML('beforeend',`<div class="bub me">${esc(t)}<time>now</time></div>`);msgs.scrollTop=msgs.scrollHeight;inp.value='';
    const l=listing(c.listingId);
    if(u.role==='student'){
      msgs.insertAdjacentHTML('beforeend','<div class="typing" id="typing"><i></i><i></i><i></i></div>');msgs.scrollTop=msgs.scrollHeight;
      setTimeout(()=>{const tp=$('#typing');tp&&tp.remove();c.msgs.push({from:c.landlordId,text:autoReply(t,l),ts:Date.now(),read:false});save();
        const inThread=stack[stack.length-1].name==='thread'&&stack[stack.length-1].params.id===cid;
        if(inThread){msgs.insertAdjacentHTML('beforeend',`<div class="bub them">${esc(c.msgs[c.msgs.length-1].text)}<time>now</time></div>`);msgs.scrollTop=msgs.scrollHeight;renderTabs('thread');}
      },1400+Math.random()*800);
    }else if(!c.autoDone&&[c.studentId].some(id=>user(id)&&user(id).role==='student')){
      c.autoDone=true;
      setTimeout(()=>{c.msgs.push({from:c.studentId,text:'Okay, asante! I\'ll come to see it tomorrow afternoon.',ts:Date.now(),read:false});save();
        const inThread=stack[stack.length-1].name==='thread'&&stack[stack.length-1].params.id===cid;
        if(inThread){msgs.insertAdjacentHTML('beforeend',`<div class="bub them">${esc(c.msgs[c.msgs.length-1].text)}<time>now</time></div>`);msgs.scrollTop=msgs.scrollHeight;renderTabs('thread');toast('New message from '+user(c.studentId).name,'message-circle');}
      },2600);
    }
  },
  /* auth */
  ar(r){AUTH.role=r;AUTH.step='role';render();},
  arNext(){AUTH.step='phone';render();},
  arBack(){AUTH.step='phone';render();},
  guest(){DB.session=null;save();tab('home');toast('Browsing as guest — sign in to contact landlords.','info');},
  demo(w){const map={student:'uS1',landlord:'uL1',landlordNew:'uL5',admin:'uA'};DB.session=map[w];save();tab('home');toast('Signed in as '+me().name+'. Karibu!','check');},
  otpSend(){const raw=($('#aph')||{}).value||AUTH.phone;const m=raw.replace(/[\s-]/g,'').match(/^(?:\+?254|0)?([17]\d{8})$/);if(!m){toast('Enter a valid Kenyan number, e.g. 0712 345 678','triangle-alert',true);return;}AUTH.phone='254'+m[1];AUTH.code=String(Math.floor(10000+Math.random()*90000));AUTH.step='otp';AUTH.sends++;AUTH.inp='';render();},
  otpIn(i,el){AUTH.inp=(AUTH.inp.slice(0,i)+el.value+AUTH.inp.slice(i+1)).slice(0,5);if(el.value&&i<4)$('#o'+(i+1)).focus();},
  otpKey(e,i){if(e.key==='Backspace'&&!e.target.value&&i>0)$('#o'+(i-1)).focus();},
  otpVerify(){if(AUTH.inp!==AUTH.code){toast('Wrong code — check the orange banner.','triangle-alert',true);return;}const ex=DB.users.find(u=>u.phone===AUTH.phone&&u.role===AUTH.role);if(ex){if(ex.suspended){toast('This account is suspended. Contact support.','ban',true);return;}DB.session=ex.id;save();tab('home');toast('Welcome back, '+ex.name.split(' ')[0]+'.','check');}else{AUTH.step='name';render();}},
  finishSignup(){const nm=($('#anm')||{}).value||'';if(nm.trim().length<3){toast('Tell us your name — landlords reply better to real names.','info');return;}const id='u'+DB.nextIds.u++;DB.users.push({id,role:AUTH.role,name:nm.trim(),phone:AUTH.phone,verified:false,verifyStatus:'none',docs:null,email:AUTH.role==='landlord'?(($('#aem')||{}).value||null):null,regNo:null,suspended:false,joined:Date.now()});DB.session=id;save();tab('home');toast('Account created. Karibu ChukaHomes!','check');},
  logout(){DB.session=null;save();stack.length=0;stack.push({name:'auth'});render();},
  /* wizard */
  newL(){DRAFT=newDraft();DRAFT.security=[];go('create',{step:1});draft=DRAFT;WSTEP=1;},
  editL(id){DRAFT=JSON.parse(JSON.stringify(listing(id)));draft=DRAFT;WSTEP=1;stack.push({name:'create',params:{step:1,editId:id}});render();},
  wGo(d){WSTEP=Math.max(1,WSTEP+d);stack[stack.length-1].params.step=WSTEP;render();},
  wNext(){
    const d=draft,eid=stack[stack.length-1].params.editId;
    if(WSTEP===1){if(!d.title||d.title.trim().length<8)return toast('Give it a clear title (at least 8 characters).','info');if(!d.type)return toast('Choose the property type.','info');if(!d.furnishing)return toast('Choose furnishing.','info');}
    if(WSTEP===2){if(!d.area)return toast('Choose the area / estate.','info');if(d.lat==null)return toast('Drag the pin onto the map to set the location.','info');if(!d.walkGate)d.walkGate=autoWalk(d);if(!d.walkStage)d.walkStage=4;}
    if(WSTEP===3){if(!d.rent||+d.rent<=0)return toast('Enter the rent amount.','info');if(!d.terms.trim())d.terms='Agree terms with the landlord directly.';}
    if(WSTEP===4){if(!d.water||!d.elec||!d.wifi)return toast('Students rely on this — pick water, electricity and WiFi options.','info');}
    if(WSTEP===5){if(!d.bath||!d.kitchen)return toast('Pick bathroom and kitchen options.','info');}
    if(WSTEP===6){if(!d.gender||!d.visitors)return toast('Pick gender restriction and visitor rules.','info');}
    if(WSTEP===7){if(d.photos.length<5)return toast('At least 5 photos required — room, bathroom, kitchen, exterior, view.','info');if(!d.confirmed)return toast('Please confirm the photos are recent and of the actual unit.','info');}
    if(WSTEP===8){d.contactPhone=d.contactPhone||me().phone;
      if(eid){Object.assign(listing(eid),d,{updatedAt:Date.now()});save();toast('Listing updated.','check');back();return;}
      const u=me();
      const limit=u.verified?5:2;
      if(DB.listings.filter(l=>l.ownerId===u.id&&l.status!=='removed'&&l.status!=='taken').length>=limit){toast(u.verified?`Listing limit reached (${limit}).`:'Free unverified accounts can post 2 live listings. Get verified to post more.','triangle-alert',true);return;}
      const id='l'+DB.nextIds.l++;
      DB.listings.push(Object.assign({},d,{id,ownerId:u.id,video:!!d.videoName,status:'available',boosted:false,flagged:false,views:0,listedAt:Date.now(),updatedAt:Date.now(),ip:'41.90.'+(10+Math.floor(Math.random()*80))+'.'+(2+Math.floor(Math.random()*250)),device:/iPhone/.test(navigator.userAgent)?'Safari · iPhone':'Chrome · Android',availFrom:d.availFrom?new Date(d.availFrom).getTime():Date.now()}));
      checkWatches(DB.listings[DB.listings.length-1]);
      save();toast(u.verified?'Listing is live. Comrades can see it now.':'Listing posted — it goes live once your landlord verification is approved.','check');
      DRAFT=null;draft=null;stack.length=0;stack.push({name:'mylistings'});render();return;}
    App.wGo(1);
  },
  sf(k,v){draft[k]=v;},
  wsel(el,k,v){draft[k]=v;const cond=['water','elec','wifi','curfewOn'].includes(k);if(cond){render();}else{[...el.parentNode.children].forEach(b=>b.classList.remove('on'));el.classList.add('on');}},
  wsec(el,v){draft.security=draft.security||[];const i=draft.security.indexOf(v);i>-1?draft.security.splice(i,1):draft.security.push(v);el.classList.toggle('on');},
  /* photos */
  addP(input){const fs=[...input.files].slice(0,8-draft.photos.length);if(!fs.length)return;Promise.all(fs.map(compress)).then(urls=>{draft.photos.push(...urls);render();toast(urls.length+' photo(s) added & compressed.','image');});},
  demoP(){draft.photos=ph('chknew'+Date.now()%97,5);render();toast('5 demo photos added. Replace with real ones before going live.','camera');},
  rmP(i){draft.photos.splice(i,1);render();},
  confP(v){draft.confirmed=v;},
  addVid(input){if(input.files[0]){draft.videoName=input.files[0].name;render();}},
  /* my listings */
  taken(id){const l=listing(id);l.status=l.status==='taken'?'available':'taken';l.updatedAt=Date.now();save();render();toast(l.status==='taken'?'Marked as taken — students will see the grey badge.':'Marked as available again.','check');},
  delL(id){const l=listing(id);modal(`<h2 style="font-size:18px">Delete “${esc(l.title)}”?</h2><p class="tiny muted" style="margin:8px 0 16px">This cannot be undone. If it's rented, marking it <b>Taken</b> keeps your record and stats.</p>
    <div style="display:flex;gap:9px"><button class="btn btn-o grow" onclick="App.closeM()">Keep it</button><button class="btn btn-danger grow" onclick="App.delGo('${id}')">Delete</button></div>`);},
  delGo(id){DB.listings=DB.listings.filter(l=>l.id!==id);DB.convs=DB.convs.filter(c=>c.listingId!==id);save();closeM();render();toast('Listing deleted.','trash-2');},
  boost(id){const l=listing(id);modal(`<h2 style="font-size:18px">Boost “${esc(l.title)}”?</h2><p class="tiny muted" style="margin:8px 0 14px">Boosts put your unit at the top of the Home feed for 7 days. In production this is <b>KES 200 via M-Pesa STK Push</b> — in this demo it's free.</p>
    <button class="btn btn-p" style="width:100%" onclick="App.boostGo('${id}')"><i data-lucide="megaphone"></i>${l.boosted?'Remove boost':'Boost for 7 days (free demo)'}</button>`);},
  boostGo(id){const l=listing(id);l.boosted=!l.boosted;save();closeM();render();toast(l.boosted?'Boosted — you\'re at the top of Home for 7 days.':'Boost removed.','megaphone');},
  /* verification */
  vSubmitS(){const u=me();u.regNo=$('#reg').value.trim();u.email=$('#semail').value.trim()||u.email;if(!u.regNo&&!u.email){toast('Add your admission number or student email.','info');return;}u.verified=true;u.verifyStatus='approved';save();back();toast('Verified Comrade badge earned. Landlords will take you seriously now.','graduation-cap');},
  docUp(k,input){const u=me();u.docs=u.docs||{};u.docs[k]=input.files[0]?input.files[0].name:'document-'+k;u.verifyStatus='pending';save();render();toast('Document attached. Submit when both are in.','file-check');},
  vSubmitL(){const u=me();if(!u.docs||!u.docs.id||!u.docs.own)return;u.verifyStatus='pending';save();render();toast('Submitted. An admin reviews ID + ownership proof manually.','clock');},
  /* admin */
  aOk(uid){const u=user(uid);u.verified=true;u.verifyStatus='approved';DB.listings.filter(l=>l.ownerId===uid&&l.status==='pending').forEach(l=>{l.status='available';l.updatedAt=Date.now();});save();render();toast(u.name+' is now a Verified Landlord. Their listings went live.','badge-check');},
  aNo(uid){const u=user(uid);u.verifyStatus='rejected';save();render();toast(u.name+' rejected — they can resubmit better documents.','x',true);},
  aDismiss(rid){const r=DB.reports.find(x=>x.id===rid);r.status='dismissed';save();render();toast('Report dismissed.','check');},
  aRemove(lid){const l=listing(lid);if(!l)return;l.status='removed';save();render();toast('Listing removed from the platform.','trash-2');},
  aFlag(lid){const l=listing(lid);l.flagged=!l.flagged;save();render();toast(l.flagged?'Listing flagged for follow-up.':'Flag removed.','flag');},
  aSusp(uid){const u=user(uid);u.suspended=!u.suspended;save();render();toast(u.suspended?u.name+' suspended — their listings are hidden.':u.name+' reinstated.',u.suspended?'ban':'check');},
  /* misc */
  lang(){toast('Kiswahili translation lands in Phase 2 — karibu tena hapo!','globe');},
  notifT(){toast('Notifications are in-app for now. Push arrives with the installable build.','bell');},
  resetDemo(){modal(`<h2 style="font-size:18px">Reset all demo data?</h2><p class="tiny muted" style="margin:8px 0 16px">Everything you created is wiped and the original seed data returns.</p><div style="display:flex;gap:9px"><button class="btn btn-o grow" onclick="App.closeM()">Cancel</button><button class="btn btn-danger grow" onclick="localStorage.removeItem('${KEY}');location.reload()">Reset</button></div>`);},
  /* wizard mini-map drag */
};
function fcount(){const el=$('#fc');el&&(el.textContent=applyF(visibleListings(),FT).length);}
function summarize(f){const b=[];f.types.length&&b.push(f.types.join(', '));(f.min||f.max)&&b.push(kes(f.min||0)+'–'+kes(f.max||0));f.maxWalk&&b.push('≤'+f.maxWalk+' min');f.areas.length&&b.push(f.areas.join(', '));return b.join(' · ')||'All listings';}
function checkWatches(l){(DB.watches||[]).forEach(w=>{if(match(l,Object.assign(emptyF(),w.criteria,{hideTaken:true})))w.newCount=(w.newCount||0)+1;});}
function autoWalk(d){if(d.lat==null)return '';const m=distM(GATE,{lat:d.lat,lng:d.lng});return Math.max(1,Math.round(m/80));}
function compress(file){return new Promise(res=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const w=Math.min(560,img.width),h=Math.round(img.height*w/img.width);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',.7));};img.onerror=()=>res(url);img.src=url;});}

/* ---------- mini-map drag binding (delegated, survives re-renders) ---------- */
function mmBind(){
  const svg=$('#mmSvg');if(!svg||svg._bound)return;svg._bound=true;
  const pin=()=>svg.querySelector('#mmPin');
  const move=e=>{const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());const g=pin();if(g)g.setAttribute('transform',`translate(${pt.x},${pt.y})`);return pt;};
  let down=false;
  svg.addEventListener('pointerdown',e=>{down=true;svg.setPointerCapture(e.pointerId);move(e);});
  svg.addEventListener('pointermove',e=>{if(down)move(e);});
  svg.addEventListener('pointerup',e=>{if(!down)return;down=false;const pt=move(e);const g=unpj(pt.x,pt.y);draft.lat=+g.lat.toFixed(5);draft.lng=+g.lng.toFixed(5);const w=autoWalk(draft);draft.walkGate=w;const wg=$('#wg');if(wg)wg.value=w;});
}

 $('#sMark').innerHTML=MARK;
setTimeout(()=>$('#splash').classList.add('off'),1150);
stack.push({name:DB.session?'home':'auth'});
render();
